<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – Movie Hub</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/FlagKyrgyzstan.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="admin-body">
<div class="background-overlay admin"></div>

<header class="navbar">
    <div class="logo">🎬 Movie Hub Admin</div>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('admin_logout') }}">Admin logout</a>

        {% if user %}
            <span class="user-info">Logged as {{ user.login }}</span>
            <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
            <a href="{{ url_for('login') }}">Login with GitHub</a>
        {% endif %}
    </nav>
</header>

<main class="content admin-page">
    <h1 class="headline">Admin Dashboard</h1>

    <section class="admin-section">
        <h2>Add movie (with optional video upload)</h2>

        <form id="admin-add-movie-form" enctype="multipart/form-data">
            <div>
                <label>Title</label>
                <input type="text" name="title" required />
            </div>

            <div>
                <label>Genre</label>
                <input type="text" name="genre" required />
            </div>

            <div>
                <label>Year</label>
                <input type="number" name="year" min="1800" max="2100" />
            </div>

            <div>
                <label>Rating</label>
                <input type="number" name="rating" step="0.1" min="0" max="10" />
            </div>

            <div style="grid-column: 1 / -1;">
                <label>Description</label>
                <textarea name="description" placeholder="Short description..."></textarea>
            </div>

            <div style="grid-column: 1 / -1;">
                <label>Video URL (optional, direct mp4/webm/ogg)</label>
                <input type="text" name="video_url" placeholder="/static/videos/your.mp4 or https://...mp4" />
            </div>

            <div style="grid-column: 1 / -1;">
                <label>OR Upload video file (mp4/webm/ogg)</label>
                <input type="file" name="video_file" accept="video/mp4,video/webm,video/ogg" />
            </div>

            <button class="primary-btn" type="submit">Create</button>
        </form>

        <p class="meta" style="margin-top:10px;">
            Upload saves file to <b>/static/videos/</b> and sets video_url automatically.
        </p>
    </section>

    <section class="admin-section">
        <h2>Movies</h2>
        <div id="admin-movie-list" class="admin-movie-list"></div>
    </section>
</main>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
