version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movies_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5

  web:
    build: .
    command: flask --app backend.server.server run --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      SQLALCHEMY_DATABASE_URI: postgresql://user:password@db:5432/movies_db
      SQLALCHEMY_TRACK_MODIFICATIONS: "false"
      # Set this to true to echo SQL queries in logs
      SQLALCHEMY_ECHO: "false"
      # OAuth2 credentials and secret key for session management
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-your_client_id_here}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-your_client_secret_here}
      SECRET_KEY: ${SECRET_KEY:-supersecret}
    depends_on:
      db:
        condition: service_healthy