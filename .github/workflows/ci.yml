name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          # Flask
          SECRET_KEY=ci_secret_key
          LOG_LEVEL=INFO

          # Database (Docker Compose)
          POSTGRES_DB=movies
          POSTGRES_USER=movies_user
          POSTGRES_PASSWORD=movies_pass
          SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://movies_user:movies_pass@db:5432/movies

          # Optional GitHub OAuth (kept empty in CI)
          GITHUB_CLIENT_ID=
          GITHUB_CLIENT_SECRET=
          EOF

      - name: Build and start (docker compose)
        run: |
          docker compose up -d --build

      - name: Wait for services
        run: |
          set -e
          echo "Waiting for db to become healthy..."
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}nohealth{{end}}' project_updated-db-1 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "DB healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "DB did not become healthy in time"
              docker compose ps
              docker compose logs db
              exit 1
            fi
            sleep 1
          done

          echo "Waiting for web to respond..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              echo "Web is up"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Web did not respond in time"
              docker compose ps
              docker compose logs web
              exit 1
            fi
            sleep 1
          done

      - name: Smoke test routes (Checkpoint requirement)
        run: |
          curl -fsS http://localhost:8080/ >/dev/null
          curl -fsS http://localhost:8080/api/movies >/dev/null
          curl -fsS http://localhost:8080/api/recommendations >/dev/null

      - name: Run tests (pytest inside container)
        run: |
          docker compose exec -T web pytest -q

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs web
          docker compose logs db

      - name: Shutdown
        if: always()
        run: |
          docker compose down -v
